// Driver-Sim: driver-training game on top of WPILib simulation.
//
// Applied from the robot project's build.gradle with:
//   if (file('../Fieldrunner/gradle/driversim.gradle').exists()) {
//       apply from: '../Fieldrunner/gradle/driversim.gradle' }
//
// Tasks (all in the "driver sim" group):
//   simulateDriverSim  - robot code + bridge in WPILib sim, and launches the Unity game, which is the only window: the
//                        bridge is the driver station and the game supplies the controller. Add -PdriverSimGui to also
//                        open the WPILib sim GUI, which then supplies joysticks and enable (the game's are ignored).
//   selfTestDriverSim  - headless scripted check of the bridge against the real robot code; fails the build on error.
//   selfTestDriverSimWithGame - the same plus the built Unity game, checking that its collisions reach the robot code.
//   testDriverSim      - unit tests for the bridge's pure logic.
//
// The bridge (Fieldrunner/bridge) is compiled as its own source set against the robot code; nothing in the robot's
// src/ changes. When a Driver-Sim run task is requested, GradleRIO's own simulateJavaRelease task is reconfigured to
// start driversim.DriverSimMain instead of the robot's Main, so WPILib's native libraries and HAL sim extensions are
// set up exactly as for ./gradlew simulateJava. Plain simulateJava is unaffected.

def driverSimRoot = buildscript.sourceFile.parentFile.parentFile

sourceSets {
    driverSim {
        java.srcDir new File(driverSimRoot, 'bridge/src/main/java')
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
    driverSimTest {
        java.srcDir new File(driverSimRoot, 'bridge/src/test/java')
        compileClasspath += sourceSets.main.output + sourceSets.driverSim.output
        runtimeClasspath += sourceSets.main.output + sourceSets.driverSim.output
    }
}

configurations {
    driverSimImplementation.extendsFrom implementation
    driverSimRuntimeOnly.extendsFrom runtimeOnly
    driverSimTestImplementation.extendsFrom implementation, testImplementation
    driverSimTestRuntimeOnly.extendsFrom runtimeOnly, testRuntimeOnly
}

tasks.register('testDriverSim', Test) {
    group = 'driver sim'
    description = 'Runs the Driver-Sim bridge unit tests.'
    testClassesDirs = sourceSets.driverSimTest.output.classesDirs
    classpath = sourceSets.driverSimTest.runtimeClasspath
    useJUnitPlatform()
    wpi.java.configureTestTasks(it)
}

// ---- run tasks: reconfigure GradleRIO's sim task only when a Driver-Sim run task was asked for

def requestedTasks = gradle.startParameter.taskNames.collect { it.tokenize(':').last() }
def isDriverSimRun = requestedTasks.contains('simulateDriverSim')
def isDriverSimSelfTestWithGame = requestedTasks.contains('selfTestDriverSimWithGame')
def isDriverSimSelfTest = requestedTasks.contains('selfTestDriverSim') || isDriverSimSelfTestWithGame

def isDriverSimGui = project.hasProperty('driverSimGui')

if (isDriverSimSelfTest || (isDriverSimRun && !isDriverSimGui)) {
    // no sim GUI: the self-test's simulated joystick values must not be overwritten, and in a normal run the bridge is
    // the driver station and the game is the only window
    wpi.sim.halExtensions.configureEach { ext ->
        if (ext.name.toLowerCase().contains('gui')) {
            ext.defaultEnabled.set(false)
        }
    }
}

if (isDriverSimRun || isDriverSimSelfTest) {
    wpi.java.simulationTaskRelease.configure { sim ->
        dependsOn tasks.named('driverSimClasses')
        classpath(sourceSets.driverSim.runtimeClasspath)
        mainClass = 'driversim.DriverSimMain'

        // who supplies joystick input and free-play enable: see driversim.InputOwner
        if (isDriverSimSelfTest) {
            environment 'DRIVERSIM_INPUT', 'selftest'
        } else if (isDriverSimGui) {
            environment 'DRIVERSIM_INPUT', 'gui'
        } else {
            environment 'DRIVERSIM_INPUT', 'game'
        }

        if (isDriverSimSelfTest) {
            environment 'DRIVERSIM_SELFTEST', '1'
        }
        if (isDriverSimSelfTestWithGame) {
            environment 'DRIVERSIM_SELFTEST', 'with-game'
        }

        if (isDriverSimRun || isDriverSimSelfTestWithGame) {
            // start the Unity game next to the robot sim. The game sends "quit" when it closes, which ends the robot
            // sim with a clean System.exit; stopDriverSimGame kills the game if the sim ends first or fails.
            doFirst {
                def game = findDriverSimGame(driverSimRoot)
                if (game == null) {
                    logger.lifecycle('[Driver-Sim] Unity game not built yet; running robot sim + bridge only. '
                            + 'Build it with Fieldrunner/scripts/build-unity.sh, or set DRIVERSIM_GAME to its path.')
                } else {
                    // DRIVERSIM_GAME_ARGS: extra space-separated arguments for the game, e.g. "--nt-host 10.57.35.2"
                    def command = [game.absolutePath, '--stop-sim-on-exit']
                    if (isDriverSimSelfTestWithGame) {
                        // the self-test ends the sim; no window is needed to check the collisions
                        command.addAll(['-batchmode', '-nographics', '--start-in', 'practice'])
                    }
                    def extraArgs = System.getenv('DRIVERSIM_GAME_ARGS')
                    if (extraArgs != null && !extraArgs.trim().isEmpty()) {
                        command.addAll(extraArgs.trim().split('\\s+'))
                    }
                    logger.lifecycle("[Driver-Sim] starting game: ${command.join(' ')}")
                    def gameProcess = new ProcessBuilder(command).inheritIO()
                    def gpuEnvironment = makeDriverSimGpuEnvironment()
                    if (!gpuEnvironment.isEmpty()) {
                        logger.lifecycle("[Driver-Sim] game GPU environment: ${gpuEnvironment}")
                    }
                    gameProcess.environment().putAll(gpuEnvironment)
                    project.ext.driverSimGameProcess = gameProcess.start()
                }
            }
            finalizedBy 'stopDriverSimGame'
        }
    }
}

tasks.register('stopDriverSimGame') {
    description = 'Stops the Unity game started by simulateDriverSim, if it is still running.'
    doLast {
        if (project.ext.has('driverSimGameProcess') && project.ext.driverSimGameProcess.isAlive()) {
            project.ext.driverSimGameProcess.destroy()
            project.ext.driverSimGameProcess.waitFor(10, java.util.concurrent.TimeUnit.SECONDS)
        }
    }
}

tasks.register('simulateDriverSim') {
    group = 'driver sim'
    description = 'Runs the robot code in WPILib sim with the Driver-Sim bridge and starts the Unity game.'
    dependsOn wpi.java.simulationTaskRelease
}

tasks.register('probeDriverSim', JavaExec) {
    group = 'driver sim'
    description = 'Connects to a running Driver-Sim like the game does; prints state and sends commands (-Pargs="...").'
    def extractNatives = wpi.java.extractNativeReleaseArtifacts
    dependsOn tasks.named('driverSimClasses'), extractNatives
    classpath = sourceSets.driverSim.runtimeClasspath
    mainClass = 'driversim.tools.NtProbe'
    if (project.hasProperty('args')) {
        args project.property('args').toString().split(',')
    }
    doFirst {
        def nativesDir = extractNatives.get().destinationDirectory.get().asFile.absolutePath
        systemProperty 'java.library.path', nativesDir
        environment 'LD_LIBRARY_PATH', nativesDir
        environment 'PATH', nativesDir + File.pathSeparator + System.getenv('PATH')
    }
}

tasks.register('selfTestDriverSimWithGame') {
    group = 'driver sim'
    description = 'Headless self-test plus the built Unity game: checks its collisions reach the robot code.'
    dependsOn wpi.java.simulationTaskRelease
}

tasks.register('selfTestDriverSim') {
    group = 'driver sim'
    description = 'Headless scripted check that the Driver-Sim bridge makes the robot code work in sim.'
    dependsOn wpi.java.simulationTaskRelease
}

/**
 * Finds the built Unity game: DRIVERSIM_GAME if set, else the platform build under Fieldrunner/unity/Builds.
 * Returns null when there is none.
 */
def findDriverSimGame(File driverSimRoot) {
    def override = System.getenv('DRIVERSIM_GAME')
    if (override != null && !override.isEmpty()) {
        return new File(override)
    }
    def os = org.gradle.internal.os.OperatingSystem.current()
    def relativePath = 'unity/Builds/Linux/DriverSim.x86_64'
    if (os.isWindows()) {
        relativePath = 'unity/Builds/Windows/DriverSim.exe'
    } else if (os.isMacOsX()) {
        relativePath = 'unity/Builds/Mac/DriverSim.app/Contents/MacOS/DriverSim'
    }
    def game = new File(driverSimRoot, relativePath)
    if (game.exists()) {
        return game
    }
    return null
}

/**
 * Makes the environment that steers the game (only the game, not the robot sim) to the discrete GPU on Linux laptops
 * with hybrid graphics: NVIDIA PRIME render offload when the NVIDIA driver is loaded, else Mesa's DRI_PRIME when there
 * is more than one GPU. Windows and macOS pick the GPU themselves (the Unity Windows player asks NVIDIA Optimus and AMD
 * switchable graphics for the high-performance GPU). Set DRIVERSIM_GPU=integrated to skip this.
 */
def makeDriverSimGpuEnvironment() {
    def environment = [:]
    def os = org.gradle.internal.os.OperatingSystem.current()
    if (!os.isLinux() || System.getenv('DRIVERSIM_GPU') == 'integrated') {
        return environment
    }

    // NVIDIA: render offload for both OpenGL and Vulkan
    if (new File('/proc/driver/nvidia/version').exists()) {
        environment['__NV_PRIME_RENDER_OFFLOAD'] = '1'
        environment['__GLX_VENDOR_LIBRARY_NAME'] = 'nvidia'
        environment['__VK_LAYER_NV_optimus'] = 'NVIDIA_only'
        return environment
    }

    // other drivers (Mesa, e.g. an AMD discrete GPU): the second render node
    def renderNodes = new File('/dev/dri').list({ dir, name -> name.startsWith('renderD') } as FilenameFilter)
    if (renderNodes != null && renderNodes.length > 1) {
        environment['DRI_PRIME'] = '1'
    }
    return environment
}
